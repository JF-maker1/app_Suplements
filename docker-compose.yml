version: '3.8'

services:
  # BACKEND SERVICE (FastAPI + Supabase Connector)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rdm-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Mount source code for hot-reload and test execution
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - ./backend/scripts:/app/scripts
      # Persistence for Pytest cache to speed up re-runs
      - pytest_cache:/app/.pytest_cache
    environment:
      - PYTHONPATH=/app
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    networks:
      - rdm-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # FRONTEND SERVICE (React + Vite + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rdm-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always
    networks:
      - rdm-network

networks:
  rdm-network:
    driver: bridge

volumes:
  pytest_cache: